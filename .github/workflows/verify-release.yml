name: Verify existing npm release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Verify published registry metadata
        run: npm run release:readback
        timeout-minutes: 12
